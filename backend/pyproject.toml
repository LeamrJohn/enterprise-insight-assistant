[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-backend"
version = "2.1.0"
description = "AI Agent, RAG, and workflow platform backend"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "python-multipart>=0.0.18,<1.0",
    "openai>=1.0,<3.0",
    "tiktoken>=0.7,<1.0",
    "pgvector>=0.3,<1.0",
    "celery[redis]>=5.4,<6.0",
    "langgraph>=0.2,<2.0",
    "sqlglot>=25.0,<30.0",
    "PyJWT>=2.10,<3.0",
    "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: requires Docker Redis, PostgreSQL, and worker-test",
    "slow: loads a real embedding model or performs other slow local work",
]
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["app", "tests"]
