x-backend-environment: &backend-environment
  APP_ENV: development
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: agent_platform
  DATABASE_USER: agent_app
  DATABASE_PASSWORD: changeme_in_production
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: agent-platform-postgres
    environment:
      POSTGRES_USER: agent_app
      POSTGRES_PASSWORD: changeme_in_production
      POSTGRES_DB: agent_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/bootstrap_postgres.sql:/docker-entrypoint-initdb.d/bootstrap.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  redis:
    image: redis:7
    container_name: agent-platform-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file:
      - ./backend/.env
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment: *backend-environment
    ports:
      - "8000:8000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
      ]
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
    gpus: all
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-test:
    profiles: ["test"]
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=test",
        "--concurrency=1",
        "--hostname=worker-test@%h",
      ]
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
      APP_ENV: test
      DATABASE_NAME: agent_platform_test
      LOG_LEVEL: WARNING
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  report-worker:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=reports",
        "--hostname=report-worker@%h",
      ]
    env_file:
      - ./backend/.env
    environment: *backend-environment
    gpus: all
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped


  business_db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: agent-platform-business-db
    environment:
      POSTGRES_USER: business_app
      POSTGRES_PASSWORD: business_password
      POSTGRES_DB: business_data
    ports:
      - "5434:5432"
    volumes:
      - business_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_app"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  business_data:

networks:
  default:
    driver: bridge
